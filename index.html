<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yosakoi Simulator - Viewer</title>
<style>
  body { margin: 0; padding: 0; background: #111827; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  #header { padding: 12px; background: #1f2937; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #374151; }
  button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  button:hover { background: #2563eb; }
  input[type=range] { flex-grow: 1; cursor: pointer; }
  #stage-wrap { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #stage { background: #e5e7eb; width: 100%; max-width: 1200px; aspect-ratio: 16/9; position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .el { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2vmin; color: white; user-select: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8); border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  .el.dancer { border-radius: 50%; width: 2.5%; aspect-ratio: 1; }
</style>
</head>
<body>
  <div id="header">
    <button id="playBtn">Play / Pause</button>
    <input type="range" id="seek" min="0" max="100" value="0" step="0.05">
    <span id="timeDisplay" style="min-width: 60px; font-variant-numeric: tabular-nums;">0.0s</span>
  </div>
  <div id="stage-wrap"><div id="stage"></div></div>

  <script>
    const project = {"elements":[],"scenes":[{"id":"scene-initial","name":"S1","time":0,"positions":{}}],"audioBase64":null};
    let audio = null;
    let isPlaying = false;
    let animFrame = null;
    let currentTime = 0;
    const stage = document.getElementById('stage');
    const playBtn = document.getElementById('playBtn');
    const seek = document.getElementById('seek');
    const timeDisplay = document.getElementById('timeDisplay');
    let maxTime = project.scenes.length > 0 ? project.scenes[project.scenes.length-1].time : 0;

    // Elements Init
    const els = {};
    project.elements.forEach(elData => {
      const el = document.createElement('div');
      el.className = 'el ' + elData.type;
      el.style.backgroundColor = elData.color;
      if (elData.type === 'prop') {
        el.style.width = elData.width + '%';
        el.style.height = elData.height + '%';
        el.style.borderRadius = '4px';
      }
      el.innerText = elData.name || '';
      stage.appendChild(el);
      els[elData.id] = el;
    });

    if (project.audioBase64) {
      audio = new Audio(project.audioBase64);
      audio.addEventListener('loadedmetadata', () => {
        maxTime = Math.max(maxTime, audio.duration);
        seek.max = maxTime;
      });
      audio.addEventListener('ended', () => { isPlaying = false; });
    } else {
      seek.max = maxTime > 0 ? maxTime : 10;
    }

    playBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (audio) {
        if (isPlaying) audio.play();
        else audio.pause();
      }
    });

    seek.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      if (audio) audio.currentTime = currentTime;
      render();
    });

    (pos0, pos1, pathType, p) => {
    if (!pos0)
      return pos1 || { x: 50, y: 50 };
    if (!pos1)
      return pos0;
    if (pathType === "right-h-v") {
      if (p < 0.5)
        return { x: pos0.x + (pos1.x - pos0.x) * (p * 2), y: pos0.y };
      else
        return { x: pos1.x, y: pos0.y + (pos1.y - pos0.y) * ((p - 0.5) * 2) };
    } else if (pathType === "right-v-h") {
      if (p < 0.5)
        return { x: pos0.x, y: pos0.y + (pos1.y - pos0.y) * (p * 2) };
      else
        return { x: pos0.x + (pos1.x - pos0.x) * ((p - 0.5) * 2), y: pos1.y };
    } else if (pathType === "curve") {
      const cx = pos0.x + (pos1.x - pos0.x) / 2;
      const cy = pos0.y;
      const inv = 1 - p;
      return {
        x: inv * inv * pos0.x + 2 * inv * p * cx + p * p * pos1.x,
        y: inv * inv * pos0.y + 2 * inv * p * cy + p * p * pos1.y
      };
    }
    return {
      x: pos0.x + (pos1.x - pos0.x) * p,
      y: pos0.y + (pos1.y - pos0.y) * p
    };
  }
    (project, time) => {
    const { scenes, elements } = project;
    if (scenes.length === 0)
      return {};
    if (scenes.length === 1 || time <= scenes[0].time)
      return scenes[0].positions;
    const lastScene = scenes[scenes.length - 1];
    if (time >= lastScene.time)
      return lastScene.positions;
    let s0 = scenes[0], s1 = scenes[1];
    for (let i = 0; i < scenes.length - 1; i++) {
      if (time >= scenes[i].time && time < scenes[i + 1].time) {
        s0 = scenes[i];
        s1 = scenes[i + 1];
        break;
      }
    }
    const p = (time - s0.time) / (s1.time - s0.time);
    const result = {};
    elements.forEach((el) => {
      const id = el.id;
      const pos0 = s0.positions[id];
      const pos1 = s1.positions[id];
      if (!pos0 && !pos1)
        return;
      const targetPos = pos1 || pos0;
      const pathType = targetPos.pathType || "line";
      const { x, y } = calculateInterpolation(pos0, pos1, pathType, p);
      result[id] = __spreadProps(__spreadValues({}, targetPos), { x, y });
    });
    return result;
  }

    let lastTimestamp = 0;
    function loop(timestamp) {
      if (isPlaying) {
        if (audio) {
          currentTime = audio.currentTime;
        } else {
          const delta = (timestamp - lastTimestamp) / 1000;
          currentTime += delta;
          if (currentTime > seek.max) { currentTime = seek.max; isPlaying = false; }
        }
        seek.value = currentTime;
        render();
      }
      lastTimestamp = timestamp;
      animFrame = requestAnimationFrame(loop);
    }

    function render() {
      timeDisplay.innerText = currentTime.toFixed(1) + 's';
      const positions = getInterpolatedPositions(project, currentTime);
      for (const [id, pos] of Object.entries(positions)) {
        if (els[id]) {
          els[id].style.left = pos.x + '%';
          els[id].style.top = pos.y + '%';
        }
      }
    }
    
    render();
    animFrame = requestAnimationFrame(loop);
  </script>
</body>
</html>
