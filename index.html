<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>よさこい隊列シミュレーター Pro</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (CDN) for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome (CDN) for icons as requested -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* iPhoneのSafariなどで画面がスクロールしてUIが消えるのを完全に防ぐ超強力なロック */
        html, body, #root {
            position: fixed !important;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
            overflow: hidden !important; overscroll-behavior: none !important;
            margin: 0; padding: 0;
            background-color: #111827; /* Tailwind gray-900 */
        }
        .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 12px); }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        // --- Icons mapped to FontAwesome (外部CDN) ---
        const PlayIcon = () => <i className="fas fa-play"></i>;
        const PauseIcon = () => <i className="fas fa-pause"></i>;
        const PlusIcon = () => <i className="fas fa-plus"></i>;
        const TrashIcon = () => <i className="fas fa-trash"></i>;
        const UploadIcon = () => <i className="fas fa-file-import"></i>;
        const UserIcon = () => <i className="fas fa-user"></i>;
        const BoxIcon = () => <i className="fas fa-box"></i>;
        const CheckSquareIcon = () => <i className="far fa-check-square"></i>;
        const SquareIcon = () => <i className="far fa-square"></i>;
        const CurveIcon = () => <i className="fas fa-bezier-curve"></i>;
        const LinearIcon = () => <i className="fas fa-minus"></i>;
        
        const ChevronUpIcon = () => <i className="fas fa-chevron-up"></i>;
        const ChevronDownIcon = () => <i className="fas fa-chevron-down"></i>;
        const ChevronLeftIcon = () => <i className="fas fa-chevron-left"></i>;
        const ChevronRightIcon = () => <i className="fas fa-chevron-right"></i>;
        
        const UndoIcon = () => <i className="fas fa-undo"></i>;
        const RedoIcon = () => <i className="fas fa-redo"></i>;
        
        const AlignLeftIcon = () => <i className="fas fa-align-left"></i>;
        const AlignCenterIcon = () => <i className="fas fa-align-center"></i>;
        const AlignRightIcon = () => <i className="fas fa-align-right"></i>;
        const AlignTopIcon = () => <i className="fas fa-arrow-up"></i>;
        const AlignMiddleIcon = () => <i className="fas fa-arrows-alt-v"></i>;
        const AlignBottomIcon = () => <i className="fas fa-arrow-down"></i>;
        const DistributeHorizontalIcon = () => <i className="fas fa-arrows-alt-h"></i>;
        const DistributeVerticalIcon = () => <i className="fas fa-bars"></i>;
        
        const RightAngleXIcon = () => <i className="fas fa-level-down-alt" style={{transform: "rotate(-90deg)"}}></i>;
        const RightAngleYIcon = () => <i className="fas fa-level-down-alt"></i>;
        const DownloadIcon = () => <i className="fas fa-download"></i>;
        const FileCodeIcon = () => <i className="fas fa-file-code"></i>;

        const AVAILABLE_COLORS = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-green-500', 'bg-teal-500', 'bg-blue-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500', 'bg-gray-800', 'bg-black'];

        const formatTime = (seconds) => {
          const m = Math.floor(seconds / 60);
          const s = Math.floor(seconds % 60);
          const ms = Math.floor((seconds % 1) * 10);
          return `${m}:${s.toString().padStart(2, '0')}.${ms}`;
        };

        const getRandomColor = () => {
          const colors = ['bg-red-500', 'bg-blue-500', 'bg-green-500', 'bg-yellow-500', 'bg-purple-500', 'bg-pink-500', 'bg-indigo-500', 'bg-teal-500', 'bg-orange-500'];
          return colors[Math.floor(Math.random() * colors.length)];
        };

        const calculateDefaultCP = (p0, p1) => {
          const midX = (p0.x + p1.x) / 2;
          const midY = (p0.y + p1.y) / 2;
          const dx = p1.x - p0.x;
          const dy = p1.y - p0.y;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          const offset = Math.min(20, len * 0.3); 
          return { cpX: Math.max(0, Math.min(100, midX + nx * offset)), cpY: Math.max(0, Math.min(100, midY + ny * offset)) };
        };

        const getInterpolatedPosition = (entity, scenes, time) => {
          if (!entity.positions) return { x: 50, y: 50 };
          
          const sortedScenes = [...scenes].sort((a, b) => a.time - b.time);
          if (sortedScenes.length === 0) return { x: 50, y: 50 };
          
          let targetSceneIndex = 0;
          for (let i = 0; i < sortedScenes.length; i++) {
              if (time <= sortedScenes[i].time) {
                  targetSceneIndex = i;
                  break;
              }
              targetSceneIndex = i;
          }

          const targetScene = sortedScenes[targetSceneIndex];
          const prevScene = targetSceneIndex > 0 ? sortedScenes[targetSceneIndex - 1] : targetScene;
          
          const targetData = entity.positions[targetScene.id] || { x: 50, y: 50, duration: 2.0, pathType: 'linear' };
          const prevData = entity.positions[prevScene.id] || { x: 50, y: 50 };

          if (targetScene.id === prevScene.id) return { x: targetData.x, y: targetData.y };

          const moveDuration = targetData.duration !== undefined ? targetData.duration : 2.0;
          const moveStartTime = Math.max(prevScene.time, targetScene.time - moveDuration);
          
          if (time <= moveStartTime) return { x: prevData.x, y: prevData.y };
          if (time >= targetScene.time) return { x: targetData.x, y: targetData.y };

          const progress = (time - moveStartTime) / (targetScene.time - moveStartTime);
          const p0 = { x: prevData.x, y: prevData.y };
          const p1 = { x: targetData.x, y: targetData.y };
          const pathType = targetData.pathType || 'linear';

          if (pathType === 'curve' && targetData.cpX != null && targetData.cpY != null) {
              const inv = 1 - progress;
              const x = inv * inv * p0.x + 2 * inv * progress * targetData.cpX + progress * progress * p1.x;
              const y = inv * inv * p0.y + 2 * inv * progress * targetData.cpY + progress * progress * p1.y;
              return { x, y };
          } else if (pathType === 'rightAngleX') {
              if (progress < 0.5) {
                  const p = progress * 2;
                  return { x: p0.x + (p1.x - p0.x) * p, y: p0.y };
              } else {
                  const p = (progress - 0.5) * 2;
                  return { x: p1.x, y: p0.y + (p1.y - p0.y) * p };
              }
          } else if (pathType === 'rightAngleY') {
              if (progress < 0.5) {
                  const p = progress * 2;
                  return { x: p0.x, y: p0.y + (p1.y - p0.y) * p };
              } else {
                  const p = (progress - 0.5) * 2;
                  return { x: p0.x + (p1.x - p0.x) * p, y: p1.y };
              }
          } else {
              const x = p0.x + (p1.x - p0.x) * progress;
              const y = p0.y + (p1.y - p0.y) * progress;
              return { x, y };
          }
        };

        const getActiveSceneIdForTime = (time, currentScenes, currentEntities) => {
          const sScenes = [...currentScenes].sort((a, b) => a.time - b.time);
          if (sScenes.length === 0) return null;
          if (time < sScenes[0].time) return sScenes[0].id;
          
          for (let i = sScenes.length - 1; i >= 0; i--) {
            const scene = sScenes[i];
            if (time >= scene.time) {
              if (i < sScenes.length - 1) {
                const nextScene = sScenes[i + 1];
                let maxDur = 2.0;
                if (currentEntities.length > 0) {
                    maxDur = Math.max(...currentEntities.map(e => e.positions[nextScene.id]?.duration ?? 2.0));
                }
                const moveStartTime = Math.max(scene.time, nextScene.time - maxDur);
                if (time >= moveStartTime && time > scene.time) {
                  return nextScene.id;
                }
              }
              return scene.id;
            }
          }
          return sScenes[sScenes.length - 1].id;
        };

        const YosakoiFormationApp = () => {
          const [scenes, setScenes] = useState([{ id: 'scene_0', name: 'シーン 1', time: 0 }]);
          const [activeSceneId, setActiveSceneId] = useState('scene_0');
          const [entities, setEntities] = useState([]);
          
          const [history, setHistory] = useState([]);
          const [historyIndex, setHistoryIndex] = useState(-1);

          const [audioSrc, setAudioSrc] = useState(null);
          const [audioBase64, setAudioBase64] = useState(null);
          const [isPlaying, setIsPlaying] = useState(false);
          const [currentTime, setCurrentTime] = useState(0);
          const [duration, setDuration] = useState(60);
          
          const [selectedIds, setSelectedIds] = useState([]);
          const [isMultiSelectMode, setIsMultiSelectMode] = useState(false);
          const [activeTab, setActiveTab] = useState('edit');
          const [propSize, setPropSize] = useState({ w: 20, h: 5 });
          const [toast, setToast] = useState(null);

          const entitiesRef = useRef(entities);
          const scenesRef = useRef(scenes);
          useEffect(() => { entitiesRef.current = entities; }, [entities]);
          useEffect(() => { scenesRef.current = scenes; }, [scenes]);

          useEffect(() => {
            if (history.length === 0) {
              setHistory([{ entities, scenes }]);
              setHistoryIndex(0);
            }
          }, [history.length, entities, scenes]);

          const commitData = useCallback((newEntities, newScenes) => {
            setEntities(newEntities);
            setScenes(newScenes);
            setHistory(prev => {
              const next = prev.slice(0, historyIndex + 1);
              next.push({ 
                  entities: JSON.parse(JSON.stringify(newEntities)), 
                  scenes: JSON.parse(JSON.stringify(newScenes)) 
              });
              if (next.length > 50) next.shift();
              return next;
            });
            setHistoryIndex(prev => Math.min(prev + 1, 49));
          }, [historyIndex]);

          const undo = () => {
            if (historyIndex > 0) {
              const prevIndex = historyIndex - 1;
              setHistoryIndex(prevIndex);
              setEntities(history[prevIndex].entities);
              setScenes(history[prevIndex].scenes);
              setSelectedIds([]);
            }
          };

          const redo = () => {
            if (historyIndex < history.length - 1) {
              const nextIndex = historyIndex + 1;
              setHistoryIndex(nextIndex);
              setEntities(history[nextIndex].entities);
              setScenes(history[nextIndex].scenes);
              setSelectedIds([]);
            }
          };

          const dragMetaRef = useRef({ hasMoved: false, clickedId: null, toggledOnDown: false });

          const showToast = useCallback((msg) => {
            setToast(msg);
            setTimeout(() => setToast(null), 3000);
          }, []);
          
          const [dragState, setDragState] = useState(null);

          const audioRef = useRef(null);
          const stageRef = useRef(null);
          const requestRef = useRef(null);

          const stageContainerRef = useRef(null);
          const [stageSize, setStageSize] = useState({ width: 0, height: 0 });

          useEffect(() => {
            if (!stageContainerRef.current) return;
            const observer = new ResizeObserver((entries) => {
              const { width, height } = entries[0].contentRect;
              let newWidth = width;
              let newHeight = width * 0.75;
              if (newHeight > height) {
                newHeight = height;
                newWidth = height * (4 / 3);
              }
              setStageSize({ width: newWidth, height: newHeight });
            });
            observer.observe(stageContainerRef.current);
            return () => observer.disconnect();
          }, []);
          
          const activeSceneIdRef = useRef(activeSceneId);
          useEffect(() => { activeSceneIdRef.current = activeSceneId; }, [activeSceneId]);

          const exportJSON = () => {
            const data = JSON.stringify({ scenes, entities, duration, audioData: audioBase64 }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'yosakoi_data.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('データ(音源含む)を保存しました');
          };

          const importJSON = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = JSON.parse(event.target.result);
                if (data.scenes && data.entities) {
                  setEntities(data.entities);
                  setScenes(data.scenes);
                  setHistory([{ entities: data.entities, scenes: data.scenes }]);
                  setHistoryIndex(0);
                  
                  if (data.duration) setDuration(data.duration);
                  const firstSceneId = data.scenes[0]?.id || 'scene_0';
                  const firstSceneTime = data.scenes[0]?.time || 0;
                  
                  setActiveSceneId(firstSceneId);
                  setCurrentTime(firstSceneTime);
                  if (audioRef.current) audioRef.current.currentTime = firstSceneTime;
                  
                  if (data.audioData) {
                      setAudioBase64(data.audioData);
                      setAudioSrc(data.audioData);
                      showToast('データと音源を読み込みました');
                  } else {
                      showToast('データを読み込みました(旧バージョンのデータ)');
                  }
                }
              } catch (err) {
                showToast('ファイルの読み込みに失敗しました');
              }
            };
            reader.readAsText(file);
            e.target.value = null;
          };

          const sortedScenes = useMemo(() => [...scenes].sort((a, b) => a.time - b.time), [scenes]);

          const updateTime = useCallback(() => {
            if (audioRef.current && isPlaying) {
              const time = audioRef.current.currentTime;
              setCurrentTime(time);
              
              const nextActiveId = getActiveSceneIdForTime(time, scenes, entities);
              if (nextActiveId && nextActiveId !== activeSceneIdRef.current) {
                setActiveSceneId(nextActiveId);
              }
              
              requestRef.current = requestAnimationFrame(updateTime);
            }
          }, [isPlaying, scenes, entities]);

          useEffect(() => {
            if (isPlaying) {
              requestRef.current = requestAnimationFrame(updateTime);
            } else {
              cancelAnimationFrame(requestRef.current);
            }
            return () => cancelAnimationFrame(requestRef.current);
          }, [isPlaying, updateTime]);

          const togglePlay = () => {
            if (!audioSrc && entities.length === 0) return;
            const nextPlayState = !isPlaying;
            setIsPlaying(nextPlayState);
            if (audioRef.current) {
              if (nextPlayState) {
                if(audioSrc) audioRef.current.play();
              } else {
                audioRef.current.pause();
              }
            }
          };

          const handleAudioUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              const url = URL.createObjectURL(file);
              setAudioSrc(url);
              setIsPlaying(false);
              setCurrentTime(0);
              setActiveSceneId(sortedScenes[0]?.id || 'scene_0');

              const reader = new FileReader();
              reader.onloadend = () => {
                setAudioBase64(reader.result);
              };
              reader.readAsDataURL(file);
            }
          };

          const handleSeek = (e) => {
            const time = parseFloat(e.target.value);
            setCurrentTime(time);
            if (audioRef.current) {
              audioRef.current.currentTime = time;
            }
            const nextActiveId = getActiveSceneIdForTime(time, scenes, entities);
            if (nextActiveId && nextActiveId !== activeSceneIdRef.current) {
               setActiveSceneId(nextActiveId);
            }
          };

          const handleSceneSelect = (sceneId) => {
            setActiveSceneId(sceneId);
            const scene = scenes.find(s => s.id === sceneId);
            if (scene) {
              setCurrentTime(scene.time);
              if (audioRef.current) audioRef.current.currentTime = scene.time;
              if (isPlaying) togglePlay(); 
            }
          };

          const addScene = () => {
            const newId = `scene_${Date.now()}`;
            const newTime = currentTime;
            
            const newEntities = entities.map(ent => {
              const currentPos = getInterpolatedPosition(ent, scenes, newTime);
              let prevPos = currentPos;
              for (let i = sortedScenes.length - 1; i >= 0; i--) {
                if (sortedScenes[i].time <= newTime && ent.positions[sortedScenes[i].id]) {
                  prevPos = ent.positions[sortedScenes[i].id];
                  break;
                }
              }
              const cp = calculateDefaultCP(prevPos, currentPos);
              return {
                ...ent,
                positions: {
                  ...ent.positions,
                  [newId]: { x: currentPos.x, y: currentPos.y, pathType: 'linear', cpX: cp.cpX, cpY: cp.cpY }
                }
              };
            });
            
            const newScenes = [...scenes, { id: newId, name: `シーン ${scenes.length + 1}`, time: newTime }];
            commitData(newEntities, newScenes);
            setActiveSceneId(newId);
          };

          const updateSceneTime = (sceneId, newTime) => {
            const newScenes = scenes.map(s => s.id === sceneId ? { ...s, time: Math.max(0, Math.min(duration, newTime)) } : s);
            commitData(entities, newScenes);
          };

          const updateSceneName = (sceneId, newName) => {
            const newScenes = scenes.map(s => s.id === sceneId ? { ...s, name: newName } : s);
            commitData(entities, newScenes);
          };
          
          const deleteScene = (sceneId) => {
            if (scenes.length <= 1) return;
            const newScenes = scenes.filter(s => s.id !== sceneId);
            const newEntities = entities.map(ent => {
              const newPos = { ...ent.positions };
              delete newPos[sceneId];
              return { ...ent, positions: newPos };
            });
            commitData(newEntities, newScenes);
            if (activeSceneId === sceneId) {
              handleSceneSelect(sortedScenes[0].id);
            }
          };

          const applyMovementToFuture = (ent, newX, newY, dx, dy) => {
            const sScenes = [...scenes].sort((a,b) => a.time - b.time);
            const actIdx = sScenes.findIndex(s => s.id === activeSceneId);
            const currentPos = ent.positions[activeSceneId] || {x:50, y:50};
            const newPositions = { ...ent.positions };
            
            newPositions[activeSceneId] = {
                ...currentPos, x: newX, y: newY,
                ...(currentPos.cpX != null ? { cpX: currentPos.cpX + dx, cpY: currentPos.cpY + dy } : {})
            };
            
            for(let i = actIdx + 1; i < sScenes.length; i++) {
                const fId = sScenes[i].id;
                if (ent.positions[fId]?.x === currentPos.x && ent.positions[fId]?.y === currentPos.y) {
                    newPositions[fId] = {
                        ...ent.positions[fId], x: newX, y: newY,
                        ...(ent.positions[fId].cpX != null ? { cpX: ent.positions[fId].cpX + dx, cpY: ent.positions[fId].cpY + dy } : {})
                    };
                } else {
                    break;
                }
            }
            return newPositions;
          };

          const nudgeSelected = (dx, dy) => {
            const newEntities = entities.map(ent => {
              if (!selectedIds.includes(ent.id)) return ent;
              const currentPos = ent.positions[activeSceneId] || { x: 50, y: 50, pathType: 'linear' };
              const newX = Math.max(0, Math.min(100, currentPos.x + dx));
              const newY = Math.max(0, Math.min(100, currentPos.y + dy));
              return { ...ent, positions: applyMovementToFuture(ent, newX, newY, dx, dy) };
            });
            commitData(newEntities, scenes);
          };

          const alignSelected = (alignment) => {
            if (selectedIds.length < 2) return;
            const selectedPositions = entities.filter(e => selectedIds.includes(e.id)).map(e => ({
                id: e.id,
                x: e.positions[activeSceneId]?.x ?? 50,
                y: e.positions[activeSceneId]?.y ?? 50
            }));

            const minX = Math.min(...selectedPositions.map(p => p.x));
            const maxX = Math.max(...selectedPositions.map(p => p.x));
            const minY = Math.min(...selectedPositions.map(p => p.y));
            const maxY = Math.max(...selectedPositions.map(p => p.y));
            const midX = (minX + maxX) / 2;
            const midY = (minY + maxY) / 2;

            const updates = {};
            if (alignment === 'left') selectedPositions.forEach(p => updates[p.id] = { x: minX });
            if (alignment === 'center') selectedPositions.forEach(p => updates[p.id] = { x: midX });
            if (alignment === 'right') selectedPositions.forEach(p => updates[p.id] = { x: maxX });
            if (alignment === 'top') selectedPositions.forEach(p => updates[p.id] = { y: minY });
            if (alignment === 'middle') selectedPositions.forEach(p => updates[p.id] = { y: midY });
            if (alignment === 'bottom') selectedPositions.forEach(p => updates[p.id] = { y: maxY });
            if (alignment === 'distributeX' && selectedPositions.length > 2) {
              const sorted = [...selectedPositions].sort((a, b) => a.x - b.x);
              const step = (maxX - minX) / (sorted.length - 1);
              sorted.forEach((p, i) => updates[p.id] = { x: minX + step * i });
            }
            if (alignment === 'distributeY' && selectedPositions.length > 2) {
              const sorted = [...selectedPositions].sort((a, b) => a.y - b.y);
              const step = (maxY - minY) / (sorted.length - 1);
              sorted.forEach((p, i) => updates[p.id] = { y: minY + step * i });
            }

            const newEntities = entities.map(ent => {
              if (updates[ent.id]) {
                const currentPos = ent.positions[activeSceneId] || { x: 50, y: 50 };
                const nextX = updates[ent.id].x ?? currentPos.x;
                const nextY = updates[ent.id].y ?? currentPos.y;
                return { ...ent, positions: applyMovementToFuture(ent, nextX, nextY, nextX - currentPos.x, nextY - currentPos.y) };
              }
              return ent;
            });
            commitData(newEntities, scenes);
          };

          const addEntity = (type, count = 1, customSize = null) => {
            const newEntities = [];
            const baseId = Date.now();
            for (let i = 0; i < count; i++) {
              const id = `${type}_${baseId}_${i}`;
              const name = type === 'dancer' ? (count > 1 ? `踊 G${i+1}` : `踊り子`) : `大道具`;
              const color = type === 'dancer' ? getRandomColor() : 'bg-gray-800';
              const startX = 50 + (i * 5 - (count > 1 ? 10 : 0));
              const startY = type === 'prop' ? 80 : 50;
              const initialPositions = {};
              scenes.forEach(s => {
                initialPositions[s.id] = { x: startX, y: startY, pathType: 'linear', cpX: startX, cpY: startY - 10, duration: 2.0 };
              });
              const entity = { id, type, name, color, positions: initialPositions };
              if (type === 'prop' && customSize) entity.size = { ...customSize };
              newEntities.push(entity);
            }
            const updatedList = [...entities, ...newEntities];
            commitData(updatedList, scenes);
            setSelectedIds(newEntities.map(e => e.id));
            if (count === 1) setActiveTab('edit');
          };

          const removeSelectedEntities = () => {
            const newEntities = entities.filter(e => !selectedIds.includes(e.id));
            commitData(newEntities, scenes);
            setSelectedIds([]);
          };

          const updateSelectedEntity = (updates) => {
            const newEntities = entities.map(ent => selectedIds.includes(ent.id) ? { ...ent, ...updates } : ent);
            commitData(newEntities, scenes);
          };
          
          const updateSelectedPositionProps = (updates) => {
            const newEntities = entities.map(ent => {
              if (!selectedIds.includes(ent.id)) return ent;
              const currentPos = ent.positions[activeSceneId] || { x: 50, y: 50, pathType: 'linear' };
              const updatedPos = { ...currentPos, ...updates };
              if (updates.pathType === 'curve' && currentPos.pathType !== 'curve') {
                  const activeIndex = sortedScenes.findIndex(s => s.id === activeSceneId);
                  if (activeIndex > 0) {
                    const p0 = ent.positions[sortedScenes[activeIndex - 1].id] || {x: 50, y:50};
                    const cp = calculateDefaultCP(p0, updatedPos);
                    updatedPos.cpX = cp.cpX;
                    updatedPos.cpY = cp.cpY;
                  }
              }
              return { ...ent, positions: { ...ent.positions, [activeSceneId]: updatedPos } };
            });
            commitData(newEntities, scenes);
          };

          const getPointerPercent = (e) => {
            if (!stageRef.current) return { x: 50, y: 50 };
            const rect = stageRef.current.getBoundingClientRect();
            const clientX = e.clientX ?? (e.touches && e.touches[0].clientX);
            const clientY = e.clientY ?? (e.touches && e.touches[0].clientY);
            if (clientX == null) return { x: 50, y: 50 };
            
            return {
              x: Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100)),
              y: Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100))
            };
          };

          const handlePointerDownStage = (e) => {
            if (e.target === stageRef.current) {
              setSelectedIds([]);
            }
          };

          const handlePointerDownEntity = (e, id) => {
            e.stopPropagation();
            if (isPlaying) togglePlay();

            let newSelected = [...selectedIds];
            let toggledOnDown = false;
            if (isMultiSelectMode) {
              if (!newSelected.includes(id)) { newSelected.push(id); toggledOnDown = true; }
            } else {
              if (!newSelected.includes(id)) { newSelected = [id]; toggledOnDown = true; }
            }
            
            setSelectedIds(newSelected);
            setActiveTab('edit');

            const activeScene = scenes.find(s => s.id === activeSceneId);
            if (activeScene) {
                setCurrentTime(activeScene.time);
                if(audioRef.current) audioRef.current.currentTime = activeScene.time;
            }

            const startPercent = getPointerPercent(e);
            dragMetaRef.current = { hasMoved: false, clickedId: id, toggledOnDown };

            const sScenes = [...scenes].sort((a,b)=>a.time-b.time);
            const actIdx = sScenes.findIndex(s=>s.id===activeSceneId);

            setDragState({
              type: 'entity',
              startPercent,
              selectedIds: newSelected,
              initialPositions: newSelected.map(selId => {
                const ent = entities.find(e => e.id === selId);
                const pos = ent.positions[activeSceneId] || {x: 50, y: 50};
                
                const linkedFutureScenes = [];
                for(let i = actIdx + 1; i < sScenes.length; i++) {
                    const fId = sScenes[i].id;
                    if (ent.positions[fId]?.x === pos.x && ent.positions[fId]?.y === pos.y) {
                        linkedFutureScenes.push(fId);
                    } else break;
                }
                return { id: selId, x: pos.x, y: pos.y, linkedFutureScenes };
              })
            });
          };

          const handlePointerDownCP = (e, entityId) => {
            e.stopPropagation();
            if (isPlaying) togglePlay();
            
            const activeScene = scenes.find(s => s.id === activeSceneId);
            if (activeScene) {
                setCurrentTime(activeScene.time);
                if(audioRef.current) audioRef.current.currentTime = activeScene.time;
            }
            setDragState({ type: 'controlPoint', entityId });
          };

          const handlePointerMove = useCallback((e) => {
            if (!dragState) return;
            const { x, y } = getPointerPercent(e);

            if (dragState.type === 'entity') {
              const dx = x - dragState.startPercent.x;
              const dy = y - dragState.startPercent.y;
              if (Math.abs(dx) > 0.2 || Math.abs(dy) > 0.2) dragMetaRef.current.hasMoved = true;

              setEntities(prev => prev.map(ent => {
                if (!dragState.selectedIds.includes(ent.id)) return ent;
                const initialPos = dragState.initialPositions.find(p => p.id === ent.id) || {x:50, y:50, linkedFutureScenes: []};
                const newX = Math.max(0, Math.min(100, initialPos.x + dx));
                const newY = Math.max(0, Math.min(100, initialPos.y + dy));
                
                const currentPos = ent.positions[activeSceneId] || { pathType: 'linear' };
                const newPositions = { ...ent.positions };
                newPositions[activeSceneId] = {
                    ...currentPos, x: newX, y: newY,
                    ...(currentPos.cpX != null ? { cpX: Math.max(0, Math.min(100, currentPos.cpX + dx)), cpY: Math.max(0, Math.min(100, currentPos.cpY + dy)) } : {})
                };

                initialPos.linkedFutureScenes.forEach(fId => {
                    if(ent.positions[fId]) {
                        newPositions[fId] = {
                            ...ent.positions[fId], x: newX, y: newY,
                            ...(ent.positions[fId].cpX != null ? { cpX: Math.max(0, Math.min(100, ent.positions[fId].cpX + dx)), cpY: Math.max(0, Math.min(100, ent.positions[fId].cpY + dy)) } : {})
                        };
                    }
                });
                return { ...ent, positions: newPositions };
              }));
            } else if (dragState.type === 'controlPoint') {
              dragMetaRef.current.hasMoved = true;
              setEntities(prev => prev.map(ent => {
                if (ent.id !== dragState.entityId) return ent;
                return { ...ent, positions: { ...ent.positions, [activeSceneId]: { ...ent.positions[activeSceneId], cpX: x, cpY: y } } };
              }));
            }
          }, [dragState, activeSceneId]);

          const handlePointerUp = useCallback(() => {
            if (dragState && dragState.type === 'entity') {
                if (!dragMetaRef.current.hasMoved) {
                    if (isMultiSelectMode && !dragMetaRef.current.toggledOnDown) {
                        setSelectedIds(prev => prev.filter(i => i !== dragMetaRef.current.clickedId));
                    }
                } else {
                    commitData(entitiesRef.current, scenesRef.current);
                }
            } else if (dragState && dragState.type === 'controlPoint' && dragMetaRef.current.hasMoved) {
                commitData(entitiesRef.current, scenesRef.current);
            }
            setDragState(null);
          }, [dragState, isMultiSelectMode, commitData]);

          useEffect(() => {
            if (dragState) {
              window.addEventListener('pointermove', handlePointerMove);
              window.addEventListener('pointerup', handlePointerUp);
              window.addEventListener('touchmove', handlePointerMove, { passive: false });
              window.addEventListener('touchend', handlePointerUp);
            }
            return () => {
              window.removeEventListener('pointermove', handlePointerMove);
              window.removeEventListener('pointerup', handlePointerUp);
              window.removeEventListener('touchmove', handlePointerMove);
              window.removeEventListener('touchend', handlePointerUp);
            };
          }, [dragState, handlePointerMove, handlePointerUp]);

          const activeSceneIndex = sortedScenes.findIndex(s => s.id === activeSceneId);
          const prevScene = activeSceneIndex > 0 ? sortedScenes[activeSceneIndex - 1] : null;

          return (
            <div className="fixed inset-0 w-full h-full h-[100dvh] flex flex-col bg-gray-900 text-gray-100 font-sans select-none overflow-hidden pb-[env(safe-area-inset-bottom)]">
              <audio 
                ref={audioRef} 
                src={audioSrc} 
                onLoadedMetadata={() => setDuration(audioRef.current.duration)}
                onEnded={() => setIsPlaying(false)}
              />

              {toast && (
                <div className="absolute top-16 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded shadow-xl z-50 text-sm border border-gray-600 flex items-center gap-2 pointer-events-none">
                    <span className="w-2 h-2 rounded-full bg-green-500"></span>
                    {toast}
                </div>
              )}

              {/* Header */}
              <header className="bg-gray-900 border-b border-gray-700 px-3 py-2 flex items-center justify-between z-10 shrink-0">
                <h1 className="text-sm md:text-base font-bold text-white flex items-center gap-2">
                  よさこい隊列シム <span className="text-xs bg-blue-600 px-2 py-0.5 rounded-full">Pro</span>
                </h1>
                <div className="flex items-center gap-2">
                  <label className="cursor-pointer bg-gray-800 border border-gray-600 hover:bg-gray-700 text-white p-1.5 md:px-3 md:py-1.5 rounded-md text-xs font-medium flex items-center gap-1 transition-colors" title="データ読込">
                    <UploadIcon />
                    <span className="hidden md:inline">読込</span>
                    <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                  </label>
                  <button onClick={exportJSON} className="bg-gray-800 border border-gray-600 hover:bg-gray-700 text-white p-1.5 md:px-3 md:py-1.5 rounded-md text-xs font-medium flex items-center gap-1 transition-colors" title="データ保存">
                    <DownloadIcon />
                    <span className="hidden md:inline">保存</span>
                  </button>
                  <div className="w-px h-6 bg-gray-700 mx-1"></div>
                  <button onClick={undo} disabled={historyIndex <= 0} className="bg-gray-800 border border-gray-600 hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-white p-1.5 rounded-md transition-colors" title="元に戻す">
                    <UndoIcon />
                  </button>
                  <button onClick={redo} disabled={historyIndex >= history.length - 1} className="bg-gray-800 border border-gray-600 hover:bg-gray-700 disabled:opacity-30 disabled:cursor-not-allowed text-white p-1.5 rounded-md transition-colors" title="やり直し">
                    <RedoIcon />
                  </button>
                  <div className="w-px h-6 bg-gray-700 mx-1"></div>
                  <label className="cursor-pointer bg-gray-800 border border-gray-600 hover:bg-gray-700 text-white px-3 py-1.5 rounded-md text-xs font-medium flex items-center gap-1 transition-colors">
                    <span>MP3音源</span>
                    <input type="file" accept="audio/mp3" onChange={handleAudioUpload} className="hidden" />
                  </label>
                </div>
              </header>

              {/* Main Stage */}
              <div className="flex-1 relative flex flex-col min-h-0 bg-gray-800">
                <div ref={stageContainerRef} className="flex-1 relative p-2 flex items-center justify-center touch-none overflow-hidden min-h-0" onPointerDown={handlePointerDownStage}>
                  <div ref={stageRef} className="bg-gray-100 relative shadow-2xl overflow-hidden rounded-sm ring-1 ring-gray-700 shrink-0"
                    style={{
                      width: stageSize.width > 0 ? `${stageSize.width}px` : '100%',
                      height: stageSize.height > 0 ? `${stageSize.height}px` : '100%',
                      backgroundImage: 'linear-gradient(to right, #e5e7eb 1px, transparent 1px), linear-gradient(to bottom, #e5e7eb 1px, transparent 1px)',
                      backgroundSize: '5% 5%'
                    }}>
                    
                    <div className="absolute top-0 bottom-0 left-1/2 border-l-2 border-red-300 border-dashed pointer-events-none opacity-50"></div>
                    <div className="absolute left-0 right-0 top-1/2 border-t-2 border-red-300 border-dashed pointer-events-none opacity-50"></div>
                    <div className="absolute bottom-1 right-2 text-gray-400 text-[10px] md:text-xs select-none pointer-events-none font-bold">FRONT</div>

                    {!isPlaying && selectedIds.length === 1 && prevScene && (
                      <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" className="absolute inset-0 pointer-events-none z-0">
                        {(() => {
                          const ent = entities.find(e => e.id === selectedIds[0]);
                          if (!ent) return null;
                          const p0 = ent.positions[prevScene.id];
                          const p1 = ent.positions[activeSceneId];
                          if (!p0 || !p1) return null;

                          if (p1.pathType === 'curve' && p1.cpX != null) {
                            return (
                              <React.Fragment>
                                <line x1={p0.x} y1={p0.y} x2={p1.cpX} y2={p1.cpY} stroke="rgba(156, 163, 175, 0.4)" strokeWidth="0.2" strokeDasharray="1,1" />
                                <line x1={p1.cpX} y1={p1.cpY} x2={p1.x} y2={p1.y} stroke="rgba(156, 163, 175, 0.4)" strokeWidth="0.2" strokeDasharray="1,1" />
                                <path d={`M ${p0.x} ${p0.y} Q ${p1.cpX} ${p1.cpY} ${p1.x} ${p1.y}`} fill="none" stroke="rgba(59, 130, 246, 0.6)" strokeWidth="0.4" />
                              </React.Fragment>
                            );
                          } else {
                            return (
                              <line x1={p0.x} y1={p0.y} x2={p1.x} y2={p1.y} stroke="rgba(59, 130, 246, 0.6)" strokeWidth="0.4" strokeDasharray="1,1" />
                            );
                          }
                        })()}
                      </svg>
                    )}

                    {entities.map(ent => {
                      const pos = isPlaying 
                        ? getInterpolatedPosition(ent, scenes, currentTime) 
                        : (ent.positions[activeSceneId] || { x: 50, y: 50 });
                      
                      const isSelected = selectedIds.includes(ent.id);
                      const sizeClass = ent.type === 'prop' 
                          ? (ent.size ? 'rounded-sm' : 'w-10 h-10 md:w-12 md:h-12 rounded-sm') 
                          : 'w-6 h-6 md:w-8 md:h-8 rounded-full';

                      return (
                        <div
                          key={ent.id}
                          onPointerDown={(e) => handlePointerDownEntity(e, ent.id)}
                          className={`absolute transform -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing shadow-sm flex items-center justify-center font-bold text-[9px] md:text-[10px] text-white leading-none text-center whitespace-nowrap overflow-hidden
                            ${sizeClass} ${ent.color} 
                            ${isSelected ? 'ring-4 ring-yellow-400 z-20 scale-110 shadow-lg' : 'ring-1 ring-black/20 z-10 opacity-90'}
                            transition-transform duration-75
                          `}
                          style={{
                            left: `${pos.x}%`, top: `${pos.y}%`,
                            width: ent.size ? `${ent.size.w}%` : undefined,
                            height: ent.size ? `${ent.size.h}%` : undefined,
                            touchAction: 'none'
                          }}
                        >
                          {ent.name.substring(0, 3)}
                        </div>
                      );
                    })}

                    {!isPlaying && selectedIds.length === 1 && prevScene && (() => {
                      const ent = entities.find(e => e.id === selectedIds[0]);
                      if (!ent) return null;
                      const p1 = ent.positions[activeSceneId];
                      if (p1 && p1.pathType === 'curve' && p1.cpX != null) {
                        return (
                          <div 
                            onPointerDown={(e) => handlePointerDownCP(e, ent.id)}
                            className="absolute w-8 h-8 transform -translate-x-1/2 -translate-y-1/2 cursor-grab active:cursor-grabbing flex items-center justify-center z-30"
                            style={{ left: `${p1.cpX}%`, top: `${p1.cpY}%`, touchAction: 'none' }}
                          >
                            <div className="w-3 h-3 bg-white border-2 border-blue-500 rounded-full shadow"></div>
                          </div>
                        );
                      }
                      return null;
                    })()}
                  </div>
                </div>
                
                {/* Timeline */}
                <div className="bg-gray-800 border-t border-gray-700 p-2 flex items-center gap-3 shrink-0 z-10 shadow-md">
                  <button onClick={togglePlay} className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center transition-colors ${isPlaying ? 'bg-red-500/20 text-red-400' : 'bg-blue-600 text-white shadow-lg'}`}>
                    {isPlaying ? <PauseIcon /> : <PlayIcon />}
                  </button>
                  <span className="text-xs font-mono w-10 text-center text-gray-300">{formatTime(currentTime)}</span>
                  
                  <div className="flex-1 relative flex items-center h-10">
                    <input type="range" min="0" max={duration} step="0.01" value={currentTime} onChange={handleSeek} className="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500 z-10 relative" />
                    <div className="absolute inset-0 pointer-events-none z-0">
                      {sortedScenes.map((s, idx) => {
                        const isActive = s.id === activeSceneId;
                        return (
                          <div key={s.id} className="absolute top-1/2 -translate-y-1/2 flex flex-col items-center transform -translate-x-1/2" style={{ left: `${(s.time / duration) * 100}%`, height: '36px' }}>
                            <span className={`text-[10px] font-black mb-0.5 ${isActive ? 'text-yellow-400' : 'text-gray-400'}`}>S{idx + 1}</span>
                            <div className={`w-[3px] h-4 rounded-sm ${isActive ? 'bg-yellow-400 shadow-[0_0_5px_rgba(250,204,21,0.8)]' : 'bg-gray-500'}`}></div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>

              <div className="shrink-0 flex flex-col bg-gray-900 border-t border-gray-700">
                <div className="flex border-b border-gray-700">
                  <button onClick={() => setActiveTab('scene')} className={`flex-1 py-2 text-xs font-bold transition-colors ${activeTab === 'scene' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700/50' : 'text-gray-400'}`}>シーン</button>
                  <button onClick={() => setActiveTab('edit')} className={`flex-1 py-2 text-xs font-bold transition-colors ${activeTab === 'edit' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700/50' : 'text-gray-400'}`}>編集 ({selectedIds.length})</button>
                  <button onClick={() => setActiveTab('add')} className={`flex-1 py-2 text-xs font-bold transition-colors ${activeTab === 'add' ? 'text-blue-400 border-b-2 border-blue-400 bg-gray-700/50' : 'text-gray-400'}`}>追加</button>
                </div>

                <div className="h-44 md:h-48 overflow-y-auto p-3 pb-safe">
                  
                  {/* TAB: SCENE */}
                  {activeTab === 'scene' && (
                    <div className="flex flex-col gap-3 h-full">
                      <div className="flex items-center gap-2 overflow-x-auto pb-2 custom-scrollbar">
                        {sortedScenes.map((s, idx) => (
                          <button key={s.id} onClick={() => handleSceneSelect(s.id)}
                            className={`shrink-0 px-3 py-2 rounded border text-xs font-bold flex flex-col items-center gap-1 min-w-[80px]
                              ${activeSceneId === s.id ? 'bg-blue-900/50 border-blue-500 text-white' : 'bg-gray-800 border-gray-600 text-gray-400'}`}
                          >
                            <span>{s.name}</span>
                            <span className="font-mono text-[10px] opacity-70">{formatTime(s.time)}</span>
                          </button>
                        ))}
                        <button onClick={addScene} className="shrink-0 px-3 py-2 rounded border border-dashed border-gray-600 text-gray-400 hover:text-white flex items-center justify-center min-w-[60px] h-[54px]">
                          <PlusIcon />
                        </button>
                      </div>

                      {activeSceneId && (
                        <div className="bg-gray-800 p-2 rounded border border-gray-700 flex flex-wrap items-center gap-3">
                          <div className="flex flex-col flex-1 min-w-[120px]">
                            <label className="text-[10px] text-gray-400 mb-1">シーン名</label>
                            <input type="text" value={scenes.find(s=>s.id===activeSceneId)?.name || ''} onChange={(e) => updateSceneName(activeSceneId, e.target.value)} className="bg-gray-900 text-xs px-2 py-1.5 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500" />
                          </div>
                          <div className="flex flex-col flex-1 min-w-[180px]">
                            <label className="text-[10px] text-gray-400 mb-1">時間微調整</label>
                            <div className="flex items-center gap-2">
                                <input type="range" min="0" max={duration} step="0.1" value={scenes.find(s=>s.id===activeSceneId)?.time || 0} onChange={(e) => updateSceneTime(activeSceneId, parseFloat(e.target.value))} className="accent-blue-500 flex-1" />
                                <input type="number" min="0" max={duration} step="0.01" value={scenes.find(s=>s.id===activeSceneId)?.time || 0} onChange={(e) => updateSceneTime(activeSceneId, parseFloat(e.target.value))} className="bg-gray-900 text-xs px-1 py-1 rounded border border-gray-600 text-white focus:outline-none w-16 text-right" />
                                <span className="text-[10px] text-gray-400">秒</span>
                            </div>
                          </div>
                          <button onClick={() => deleteScene(activeSceneId)} className="p-2 text-red-400 hover:bg-red-400/10 rounded mt-4 shrink-0" disabled={scenes.length <= 1}><TrashIcon /></button>
                        </div>
                      )}
                    </div>
                  )}

                  {/* TAB: EDIT */}
                  {activeTab === 'edit' && (
                    <div className="flex flex-col gap-3 h-full overflow-y-auto custom-scrollbar">
                      <div className="flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-3">
                          <button onClick={() => setIsMultiSelectMode(!isMultiSelectMode)} className={`flex items-center gap-1 px-3 py-1.5 rounded text-xs font-bold border transition-colors ${isMultiSelectMode ? 'bg-yellow-500/20 border-yellow-500 text-yellow-400' : 'bg-gray-800 border-gray-600 text-gray-400'}`}>
                            {isMultiSelectMode ? <CheckSquareIcon /> : <SquareIcon />} 複数選択モード
                          </button>
                          <span className="text-xs text-gray-400">{selectedIds.length} 個選択中</span>
                        </div>
                        {selectedIds.length > 0 && (
                          <button onClick={removeSelectedEntities} className="text-red-400 text-xs flex items-center gap-1 px-2 py-1 hover:bg-red-400/10 rounded"><TrashIcon /> 削除</button>
                        )}
                      </div>

                      {selectedIds.length > 0 && (
                        <div className="flex flex-wrap gap-4 mt-1 border-t border-gray-700 pt-3 shrink-0">
                          <div className="flex flex-col items-center">
                            <label className="text-[10px] text-gray-400 mb-1">位置の微調整</label>
                            <div className="flex flex-col items-center">
                              <button onClick={() => nudgeSelected(0, -0.5)} className="px-4 py-1.5 bg-gray-700 rounded-t border border-gray-600 hover:bg-gray-600"><ChevronUpIcon /></button>
                              <div className="flex">
                                <button onClick={() => nudgeSelected(-0.5, 0)} className="px-4 py-1.5 bg-gray-700 rounded-l border border-gray-600 hover:bg-gray-600"><ChevronLeftIcon /></button>
                                <button onClick={() => nudgeSelected(0, 0.5)} className="px-4 py-1.5 bg-gray-700 rounded-b border-gray-600 border-b border-x hover:bg-gray-600"><ChevronDownIcon /></button>
                                <button onClick={() => nudgeSelected(0.5, 0)} className="px-4 py-1.5 bg-gray-700 rounded-r border border-gray-600 hover:bg-gray-600"><ChevronRightIcon /></button>
                              </div>
                            </div>
                          </div>

                          {selectedIds.length === 1 && (
                            <div className="flex flex-col min-w-[120px]">
                              <label className="text-[10px] text-gray-400 mb-1">表示名 (最大3文字)</label>
                              <input type="text" maxLength="3" value={entities.find(e => e.id === selectedIds[0])?.name || ''} onChange={(e) => updateSelectedEntity({ name: e.target.value })} className="bg-gray-900 text-xs px-2 py-1.5 rounded border border-gray-600 text-white focus:outline-none focus:border-blue-500" />
                            </div>
                          )}
                          
                          {prevScene && (
                            <div className="flex flex-col border-t border-gray-700 pt-3 mt-2 w-full">
                              <div className="flex flex-col mb-2">
                                <label className="text-[10px] text-gray-400 mb-1 flex justify-between">
                                   <span>このシーンへの移動時間 (秒)</span>
                                   <span>{entities.find(e => e.id === selectedIds[0])?.positions[activeSceneId]?.duration ?? 2.0}s</span>
                                </label>
                                <input type="range" min="0" max="10" step="0.1" value={entities.find(e => e.id === selectedIds[0])?.positions[activeSceneId]?.duration ?? 2.0} onChange={(e) => updateSelectedPositionProps({ duration: parseFloat(e.target.value) })} className="accent-blue-500 w-full" />
                                <span className="text-[9px] text-gray-500 mt-0.5">※目標時間の前、指定した秒数だけ使って移動します。</span>
                              </div>

                              <label className="text-[10px] text-gray-400 mb-1">直前からの移動経路</label>
                              <div className="flex flex-wrap gap-1 bg-gray-900 rounded border border-gray-600 p-0.5 w-fit">
                                {[ { id: 'linear', icon: <LinearIcon/>, label: '直線' }, { id: 'curve', icon: <CurveIcon/>, label: 'カーブ' }, { id: 'rightAngleX', icon: <RightAngleXIcon/>, label: '横→縦' }, { id: 'rightAngleY', icon: <RightAngleYIcon/>, label: '縦→横' } ].map(type => {
                                  const currentType = entities.find(e => e.id === selectedIds[0])?.positions[activeSceneId]?.pathType || 'linear';
                                  return (
                                    <button key={type.id} onClick={() => updateSelectedPositionProps({ pathType: type.id })} className={`px-3 py-1.5 text-xs rounded flex items-center gap-1 transition-colors ${currentType === type.id ? 'bg-blue-600 text-white shadow' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800'}`}>
                                      {type.icon} {type.label}
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          )}

                          <div className="flex flex-col w-full mt-2">
                            <label className="text-[10px] text-gray-400 mb-1">色の変更</label>
                            <div className="flex flex-wrap gap-2">
                              {AVAILABLE_COLORS.map(color => {
                                const isSelectedColor = selectedIds.length === 1 && entities.find(e => e.id === selectedIds[0])?.color === color;
                                return (
                                  <button key={color} onClick={() => updateSelectedEntity({ color })} className={`w-6 h-6 rounded-full ${color} border border-gray-600 hover:scale-110 transition-transform shadow-sm ${isSelectedColor ? 'ring-2 ring-white scale-110' : ''}`} />
                                );
                              })}
                            </div>
                          </div>

                          {selectedIds.length > 1 && (
                            <div className="flex flex-col w-full mt-2 border-t border-gray-700 pt-3">
                              <label className="text-[10px] text-gray-400 mb-2">整列・等間隔 (複数選択時)</label>
                              <div className="flex flex-wrap gap-2 mb-2">
                                <div className="flex bg-gray-900 border border-gray-600 rounded">
                                  <button onClick={() => alignSelected('left')} className="p-1.5 hover:bg-gray-700 text-gray-300 border-r border-gray-600" title="左揃え"><AlignLeftIcon /></button>
                                  <button onClick={() => alignSelected('center')} className="p-1.5 hover:bg-gray-700 text-gray-300 border-r border-gray-600" title="左右中央揃え"><AlignCenterIcon /></button>
                                  <button onClick={() => alignSelected('right')} className="p-1.5 hover:bg-gray-700 text-gray-300" title="右揃え"><AlignRightIcon /></button>
                                </div>
                                <div className="flex bg-gray-900 border border-gray-600 rounded">
                                  <button onClick={() => alignSelected('top')} className="p-1.5 hover:bg-gray-700 text-gray-300 border-r border-gray-600" title="上揃え"><AlignTopIcon /></button>
                                  <button onClick={() => alignSelected('middle')} className="p-1.5 hover:bg-gray-700 text-gray-300 border-r border-gray-600" title="上下中央揃え"><AlignMiddleIcon /></button>
                                  <button onClick={() => alignSelected('bottom')} className="p-1.5 hover:bg-gray-700 text-gray-300" title="下揃え"><AlignBottomIcon /></button>
                                </div>
                              </div>
                              <div className="flex flex-wrap gap-2">
                                <button onClick={() => alignSelected('distributeX')} disabled={selectedIds.length < 3} className="px-3 py-1.5 bg-gray-900 border border-gray-600 rounded hover:bg-gray-700 text-[10px] flex items-center gap-1 text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"><DistributeHorizontalIcon /> 左右に等間隔</button>
                                <button onClick={() => alignSelected('distributeY')} disabled={selectedIds.length < 3} className="px-3 py-1.5 bg-gray-900 border border-gray-600 rounded hover:bg-gray-700 text-[10px] flex items-center gap-1 text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"><DistributeVerticalIcon /> 上下に等間隔</button>
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                      
                      {selectedIds.length === 0 && (
                        <div className="text-xs text-gray-500 py-4 text-center">ステージ上の要素をタップして選択してください。</div>
                      )}
                    </div>
                  )}

                  {/* TAB: ADD */}
                  {activeTab === 'add' && (
                    <div className="flex flex-col gap-3 h-full overflow-y-auto custom-scrollbar">
                      <div className="flex gap-2">
                          <button onClick={() => addEntity('dancer', 1)} className="flex items-center justify-center gap-2 bg-gray-800 border border-gray-600 hover:bg-gray-700 px-3 py-2 rounded text-sm text-white flex-1">
                            <UserIcon /> 踊り子
                          </button>
                      </div>
                      <div className="bg-gray-800 border border-gray-700 p-2 rounded flex flex-col gap-2">
                        <span className="text-xs font-bold text-gray-300 flex items-center gap-1"><BoxIcon/>大道具の作成</span>
                        <div className="flex items-center gap-3">
                           <div className="flex-1 flex flex-col">
                              <label className="text-[10px] text-gray-400 flex justify-between"><span>幅 (W)</span><span>{propSize.w}%</span></label>
                              <input type="range" min="1" max="100" value={propSize.w} onChange={e=>setPropSize({...propSize, w: parseInt(e.target.value)})} className="accent-yellow-500"/>
                           </div>
                           <div className="flex-1 flex flex-col">
                              <label className="text-[10px] text-gray-400 flex justify-between"><span>高さ (H)</span><span>{propSize.h}%</span></label>
                              <input type="range" min="1" max="100" value={propSize.h} onChange={e=>setPropSize({...propSize, h: parseInt(e.target.value)})} className="accent-yellow-500"/>
                           </div>
                           <div className="w-12 h-12 bg-gray-900 border border-gray-600 flex items-center justify-center shrink-0">
                              <div className="bg-gray-500" style={{width: `${propSize.w}%`, height: `${propSize.h}%`}}></div>
                           </div>
                        </div>
                        <button onClick={() => addEntity('prop', 1, propSize)} className="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-xs text-yellow-300 border border-gray-600">この形で配置</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<YosakoiFormationApp />);
    </script>
</body>
</html>
